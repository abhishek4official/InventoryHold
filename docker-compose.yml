services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-inventory}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-inventory-dev-only}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/InventoryHold.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: inventory_hold
      Redis__ConnectionString: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-inventory}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-inventory-dev-only}
      Holds__DefaultDurationMinutes: ${HOLD_DURATION_MINUTES:-15}
      Holds__SweepIntervalSeconds: ${HOLD_SWEEP_INTERVAL_SECONDS:-30}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
