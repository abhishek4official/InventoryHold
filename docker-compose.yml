services:
  mongo:
    # 7.0 on purpose: MongoDB 8.x refuses to start on Linux kernels 6.19 to 7.0.13. See the README.
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo7-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-inventory}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-inventory-dev-only}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/InventoryHold.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: inventory_hold
      Redis__ConnectionString: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-inventory}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-inventory-dev-only}
      Holds__DefaultDurationMinutes: ${HOLD_DURATION_MINUTES:-15}
      Holds__SweepIntervalSeconds: ${HOLD_SWEEP_INTERVAL_SECONDS:-30}
      # Off here so that the brief's plain endpoints can be called directly. See "Security" in the README.
      Security__Hmac__Enabled: ${HMAC_ENABLED:-false}
      Security__Hmac__Clients__web-ui: ${HMAC_WEB_SECRET:-}
      Security__Hmac__Clients__checkout: ${HMAC_CHECKOUT_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    environment:
      HMAC_WEB_SECRET: ${HMAC_WEB_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo7-data:
