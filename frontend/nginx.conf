js_path "/etc/nginx/njs/";
js_import sign from sign.js;
js_set $hmac_timestamp sign.timestamp;
js_set $hmac_signature sign.signature;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the API's limit. Keeping the two equal holds the whole body in memory, where the signer can read it.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Same-origin proxy, so the browser needs no CORS and the app needs no API URL.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Set here, so anything a browser sends in these headers is replaced.
        proxy_set_header X-Client-Id "web-ui";
        proxy_set_header X-Timestamp $hmac_timestamp;
        proxy_set_header X-Nonce $request_id;
        proxy_set_header X-Signature $hmac_signature;
    }

    location / {
        try_files $uri /index.html;
    }
}
